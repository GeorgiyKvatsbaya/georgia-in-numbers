<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open analytics over official statistics of Georgia: prices, wages, labour, GDP, trade and population. Unofficial; data from Geostat." />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Georgia in Numbers</title>
    <script>
      // Apply a stored theme before first paint to avoid a light/dark flash.
      try {
        var stored = localStorage.getItem("gin-theme");
        if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
